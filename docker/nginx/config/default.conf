# =============================================================================
# marketplace - nginx virtual host
# M6 bo'yicha qayta ko'rib chiqilgan.
#
# HTTPS HAQIDA (MUHIM): bu server FAQAT plain HTTP (listen 80) da ishlaydi va
# oldida qanday TLS-terminator turishi TASDIQLANMAGAN. Shuning uchun bu yerga
# HSTS (Strict-Transport-Security) QO'SHILMADI - HTTP ustidan yuborilgan HSTS
# brauzer tomonidan e'tiborsiz qoldiriladi, TLS-terminator bo'lsa esa uni o'sha
# yerda qo'yish kerak. Topologiya tasdiqlangach HSTS ni TLS terminatorida yoqing.
# =============================================================================

server {
    listen 80;
    index index.php index.html;
    root /var/www/app/public;

    server_name 127.0.0.1 localhost;

    # -------------------------------------------------------------------------
    # M6: CORS BUTUNLAY OLIB TASHLANDI.
    # Oldin bu yerda "Access-Control-Allow-Origin: *" va
    # "Access-Control-Allow-Credentials: true" birga turardi - bu kombinatsiya
    # spetsifikatsiya bo'yicha noto'g'ri (brauzer so'rovni rad etadi) va
    # Laravel'ning o'z CORS middleware'i bilan sarlavhalarni ikkilantirardi.
    # Bundan buyon CORS'ni FAQAT Laravel (config/cors.php) boshqaradi.
    # OPTIONS preflight ham Laravel'ga uzatiladi (location / -> index.php).
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # M6: xavfsizlik sarlavhalari.
    # Bular server blokida turgani uchun quyidagi barcha location'larga meros
    # bo'lib o'tadi (hech bir child location o'z add_header'ini qo'shmaydi).
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS ATAYIN YO'Q - yuqoridagi izohga qarang.

    # -------------------------------------------------------------------------
    # M6: yashirin (dot) fayllarni yopish: .env, .git, .htaccess, .DS_Store ...
    # /.well-known/ ISTISNO qilindi, chunki u ACME (Let's Encrypt HTTP-01)
    # va security.txt uchun kerak; u yerda faqat statik fayllar beriladi.
    # -------------------------------------------------------------------------
    location ^~ /.well-known/ {
        allow all;
        try_files $uri =404;
    }

    location ~ /\. {
        access_log off;
        log_not_found off;
        # 403 emas, 404: 403 "bu fayl bor, lekin bermayman" degan ma'lumotni
        # oshkor qiladi. 404 esa hech narsa aytmaydi.
        return 404;
    }

    # -------------------------------------------------------------------------
    # M6: yuklangan fayllar PHP sifatida BAJARILMASIN.
    # public/storage -> storage/app/public simlink; foydalanuvchi yuklagan
    # fayllar shu yerda. ^~ prefiksi regex location'lardan ustun turadi, ya'ni
    # bu yo'l ostidagi .php fayl hech qachon fastcgi ga bormaydi.
    # -------------------------------------------------------------------------
    location ^~ /storage/ {
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # M5: nginx uchun healthcheck endpoint'i.
    # Ilovaga (PHP/DB) TEGMAYDI - faqat "nginx protsessi javob beryaptimi"
    # degan savolga javob beradi. Laravel 10 da tayyor /up route yo'q, routes/
    # esa boshqa ishchining mas'uliyatida, shuning uchun endpoint shu yerda.
    # Faqat ichki (docker) tarmoqlardan ochiq.
    # -------------------------------------------------------------------------
    location = /nginx-health {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        # M6: eng muhim himoya - faqat DISKDA MAVJUD .php fayl bajariladi.
        # Usiz "/uploads/rasm.jpg/x.php" kabi yo'llar FPM ga uzatilib,
        # path-info orqali kod bajarilishiga olib kelishi mumkin edi.
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        # Oldin 1000s edi. Endi FPM ning o'z limitlariga moslandi:
        # pool: request_terminate_timeout = 90, max_execution_time = 90.
        # 95 > 90 - ya'ni avval PHP o'zini to'xtatadi va xatoni LOGGA yozadi,
        # nginx esa 504 bilan aloqani uzib yubormaydi.
        fastcgi_read_timeout 95s;
        fastcgi_send_timeout 95s;
        fastcgi_connect_timeout 10s;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # httpoxy (CVE-2016-5385) himoyasi: mijoz yuborgan "Proxy:" sarlavhasi
        # PHP ichida HTTP_PROXY env'ga aylanib qolmasin.
        fastcgi_param HTTP_PROXY "";

        # expose_php=Off bo'lsa ham, ehtiyot chorasi.
        fastcgi_hide_header X-Powered-By;
    }
}
