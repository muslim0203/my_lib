user  nginx;
worker_processes  6;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # M6: nginx versiyasini javob sarlavhasi ("Server: nginx/1.27.x") va xato
    # sahifalarida ko'rsatmaslik. Bu versiyaga qarab hujum tanlashni qiyinlashtiradi.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    #tcp_nopush     on;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

    # M6: "gzip on" o'zi FAQAT text/html ni siqadi (gzip_types default = text/html).
    # API JSON javoblari va statik assetlar siqilmay ketardi. Endi ro'yxat aniq.
	gzip on;
	gzip_disable "msie6";
	gzip_vary on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types
	    text/plain
	    text/css
	    text/xml
	    text/javascript
	    application/javascript
	    application/json
	    application/ld+json
	    application/manifest+json
	    application/rss+xml
	    application/vnd.api+json
	    application/xml
	    application/xhtml+xml
	    image/svg+xml
	    font/ttf
	    font/otf;
	# DIQQAT: audio/video (mp3, mp4) va rasm formatlari ATAYIN ro'yxatda yo'q -
	# ular allaqachon siqilgan, qayta siqish faqat CPU sarflaydi.


	#Optimizing
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_send_timeout 120;

    client_body_buffer_size 128k;
    # B6/M6 - uch limitning MUVOFIQLIGI:
    #   nginx  client_max_body_size = 100m   <- eng tashqi, eng katta
    #   PHP    post_max_size         = 96M
    #   PHP    upload_max_filesize   = 80M
    #   Laravel config/filesystems.php 'max_upload_size' = 70 MB
    # Ya'ni BOG'LOVCHI CHEKLOV = ilovaning o'z 70 MB validatsiyasi. nginx va PHP
    # limitlari undan yuqori, shuning uchun foydalanuvchi ilovadan tushunarli
    # validatsiya xatosi oladi, nginx'dan tushunarsiz "413" emas.
	client_max_body_size 100m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    # 10s -> 60s: 70 MB audio yuklashda sekin kanalda body o'qish tanaffuslari
    # 10 soniyadan oshib 408 (Request Timeout) berardi.
    client_body_timeout 60;
    client_header_timeout 10;

    # include oxirida: virtual host'lar http-level default'lar aniqlangandan
    # keyin yuklansin (o'qish uchun tushunarliroq).
    include /etc/nginx/conf.d/*.conf;
}
