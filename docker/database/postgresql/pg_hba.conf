# =============================================================================
# marketplace - PostgreSQL host-based authentication
#
# Bu fayl docker-compose.yml / docker-compose.prod.yml tomonidan
# /etc/postgresql/pg_hba.conf ga read-only mount qilinadi va server unga
#     command: postgres -c hba_file=/etc/postgresql/pg_hba.conf ...
# orqali ATAYIN yo'naltiriladi. Faqat mount qilishning o'zi YETARLI EMAS edi:
# rasmiy postgres image /var/lib/postgresql/data/pg_hba.conf ni o'qiydi.
#
# B2 da tuzatilgan xatolar:
#   - eski 6-satr: "host all all all md5"  ->  HAR QANDAY foydalanuvchi, HAR
#     QANDAY baza, HAR QANDAY manbadan. Undan keyingi torroq qoidalar (127.0.0.1,
#     ::1) O'LIK edi, chunki pg_hba BIRINCHI MOS KELGAN qoidada to'xtaydi.
#   - md5 -> scram-sha-256 (md5 parol xeshi zaif va PG14+ da eskirgan).
#
# DIQQAT (OPERATOR UCHUN): md5 -> scram-sha-256 ga o'tish MAVJUD parollarni
# avtomatik ko'chirmaydi. Bazada md5 xeshi bilan saqlangan foydalanuvchilar
# ulanolmay qoladi. Har bir foydalanuvchi uchun parolni QAYTA O'RNATISH shart:
#     SET password_encryption = 'scram-sha-256';
#     ALTER USER <user> WITH PASSWORD '<yangi yoki ayni o'sha parol>';
# Tekshirish:  SELECT rolname, rolpassword IS NOT NULL,
#                     substring(rolpassword for 12) FROM pg_authid;
#              -> "SCRAM-SHA-2" bilan boshlansa, ko'chirilgan.
# =============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# -----------------------------------------------------------------------------
# 1) Unix domain socket - FAQAT shu konteyner ichidagi protsesslar.
#    "trust" ATAYIN: (a) rasmiy image entrypoint'i initdb paytida shu soket
#    orqali ulanadi, (b) healthcheck'dagi pg_isready/psql ishlashi kerak,
#    (c) POSTGRES_USER nomi OS foydalanuvchisidan farq qilsa "peer" ishlamaydi.
#    Xavf doirasi: konteyner ichiga kira olgan kishi baribir "su postgres"
#    qila oladi, ya'ni bu qo'shimcha imtiyoz bermaydi. Tarmoq orqali EMAS.
# -----------------------------------------------------------------------------
local   all             all                                     trust

# -----------------------------------------------------------------------------
# 2) TCP - faqat docker'ning ichki (RFC1918) tarmoqlari, faqat scram-sha-256.
#    Port hostga CHIQARILMAGAN (docker-compose*.yml da database uchun "ports:"
#    yo'q), shuning uchun bu diapazonlarga faqat "marketplace" tarmog'idagi
#    konteynerlar tushadi.
#
#    OPERATOR: buni yanada toraytiring. Haqiqiy subnetni oling:
#        docker network inspect marketplace --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
#    va quyidagi uchta satrni o'sha bitta CIDR bilan almashtiring.
# -----------------------------------------------------------------------------
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# IPv6 loopback (konteyner ichidan TCP orqali ulanish).
host    all             all             ::1/128                 scram-sha-256

# -----------------------------------------------------------------------------
# 3) Replikatsiya - hozircha ishlatilmaydi, ATAYIN yopiq.
#    Kerak bo'lsa alohida replikatsiya roli yarating va shu yerga qo'shing.
# -----------------------------------------------------------------------------
# host  replication     replicator      <replica-ip>/32         scram-sha-256

# Bu yerdan pastda qoida yo'q -> mos kelmagan HAR QANDAY ulanish RAD ETILADI.
