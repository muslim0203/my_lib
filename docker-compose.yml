services:
    #1.25-alpine
    nginx:
        container_name: marketplace_nginx
        build:
            context: docker/nginx
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:9090:80"
        volumes:
            - './:/var/www/app'
            - './docker/nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro'
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - marketplace

    #8.3-fpm
    php:
        container_name: marketplace_php_fpm
        build:
            context: docker/php
            dockerfile: fpm/Dockerfile
        volumes:
            - './:/var/www/app'
            - './docker/php/fpm/config/php.ini-local:/usr/local/etc/php/php.ini:ro'
            - './docker/php/pool.d/www.conf-local:/usr/local/etc/php-fpm.d/www.conf:ro'
        working_dir: /var/www/app
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - marketplace
        extra_hosts:
            - "host.docker.internal:host-gateway"

    #8.3-cli
    php-cli:
        container_name: marketplace_php_cli
        build:
            context: docker/php
            dockerfile: cli/Dockerfile
        volumes:
            - './:/var/www/app'
            - './docker/php/cli/config/php.ini-local:/usr/local/etc/php/php.ini:ro'
        working_dir: /var/www/app
        tty: true
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - marketplace
        extra_hosts:
            - "host.docker.internal:host-gateway"

    #postgres:16
    database:
        container_name: marketplace_db
        image: postgres:16.1-alpine
        restart: always
        ports:
            - "${DB_LOCAL_PORT:-5436}:5432"
        volumes:
            - 'marketplace:/var/lib/postgresql/data'
            - './docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf'
            - './docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf'
        environment:
            POSTGRES_DB: ${DB_DATABASE:-marketplace}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret!}
            POSTGRES_HOST_AUTH_METHOD: trust
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready", "-d", "${DB_DATABASE:-marketplace}" ]
            interval: 30s
            timeout: 60s
            retries: 5
            start_period: 80s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        profiles:
            - dev
        networks:
            - marketplace

    #rabbitmq:3.13
    rabbitmq:
        container_name: marketplace_rabbitmq
        image: rabbitmq:3.13-management-alpine
        restart: always
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-rabbitmq}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-secret!}
        ports:
            - "127.0.0.1:15673:15672"
            - "127.0.0.1:5673:5672"
        volumes:
            - 'rabbitmq:/etc/rabbitmq/rabbitmq.config'
        profiles:
            - dev
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - marketplace

volumes:
    marketplace:
    rabbitmq:

networks:
    marketplace:
        external: true
